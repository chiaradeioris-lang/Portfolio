    <!-- CONTENUTO -->

    <main>


        <!-- INTRO -->

        <section class="contact-intro">

            <div class="container">

                <p class="sottotitolo">
                    CONTATTI
                </p>

                <h1>
                    Parliamo del tuo progetto.
                </h1>

                <p>
                    Hai un'idea, un progetto o semplicemente vuoi
                    metterti in contatto con me?
                    Scrivimi.
                </p>

            </div>

        </section>


        <!-- FORM -->

        <section class="contact-form">

            <div class="container">

                <form id="contact-form"> 


                    <!-- Nome -->

                    <div class="form-group">

                        <label for="nome">
                            Nome e cognome
                        </label>

                        <input type="text"
                               id="nome"
                               name="nome"
                               required>

                    </div>


                    <!-- Email -->

                    <div class="form-group">

                        <label for="email">
                            Email
                        </label>

                        <input type="email"
                               id="email"
                               name="email"
                               required>

                    </div>


                    <!-- Oggetto -->

                    <div class="form-group">

                        <label for="oggetto">
                            Oggetto
                        </label>

                        <input type="text"
                               id="oggetto"
                               name="oggetto"
                               required>

                    </div>


                    <!-- Messaggio -->

                    <div class="form-group">

                        <label for="messaggio">
                            Messaggio
                        </label>

                        <textarea id="messaggio"
                                  name="messaggio"
                                  rows="7"
                                  required></textarea>

                    </div>


                    <!-- Privacy -->

                    <div class="privacy-check">

                        <input type="checkbox"
                               id="privacy"
                               name="privacy"
                               required>

                        <label for="privacy">
                            Accetto il trattamento dei miei dati
                            per essere ricontattata.
                        </label>

                    </div>


                    <!-- Pulsante -->

                    <button type="submit"
                            class="bottone">

                        Invia messaggio →

                    </button>


                </form>

            </div>

        </section>


    </main>

	<script>

    document.getElementById("contact-form").addEventListener("submit", function(event) {

        event.preventDefault();

        emailjs.sendForm(
            "service_ztj02d3",
            "template_9sy7je7",
            this
        )

        .then(function() {

            alert("Messaggio inviato con successo!");

            document.getElementById("contact-form").reset();

        })

        .catch(function(error) {

            alert("Si è verificato un errore. Riprova.");

            console.error(error);

        });

    });

</script>
